name: iOS build
on:
  push:
    branches: [main]
    paths: ['ios/**', '.github/workflows/ios.yml', 'scripts/**', '*.js', '*.json', '*.css', '*.html', '*.svg', '*.webmanifest']
  workflow_dispatch:
    inputs:
      upload:
        description: Sign and upload to App Store Connect
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  ios:
    if: github.ref == 'refs/heads/main'
    runs-on: macos-15
    timeout-minutes: 35
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build:ios
      - name: Compile for iPhone Simulator
        if: inputs.upload != true
        run: |
          xcodebuild -version
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath "$RUNNER_TEMP/sudare-build" \
            CODE_SIGNING_ALLOWED=NO build
      - name: Capture App Store screenshot
        if: inputs.upload != true
        run: bash scripts/capture-ios.sh
      - uses: actions/upload-artifact@v4
        if: inputs.upload != true
        with:
          name: sudare-app-store-screenshot
          path: build/screenshots/sudare-scopri.jpg
          if-no-files-found: error
      - name: Archive and upload
        if: inputs.upload == true
        env:
          IOS_DISTRIBUTION_P12_BASE64: ${{ secrets.IOS_DISTRIBUTION_P12_BASE64 }}
          IOS_DISTRIBUTION_P12_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_P12_PASSWORD }}
          IOS_PROFILE_BASE64: ${{ secrets.IOS_PROFILE_BASE64 }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: bash scripts/upload-ios.sh
