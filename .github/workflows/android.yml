name: Android debug APK
on:
  push:
    branches: [main]
    paths: ['.github/workflows/android.yml', 'scripts/**', '*.js', '*.json', '*.css', '*.html', '*.svg', '*.webmanifest']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Use preinstalled Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --version
      - run: npm ci
      - run: npm test
      - name: Prepare Capacitor Android
        run: |
          npm install --no-save --package-lock=false @capacitor/android@8.4.0
          node scripts/build-ios.mjs
          npx cap add android
          npx cap sync android
      - name: Build installable debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: sudare-android-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
